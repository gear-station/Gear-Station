- type: entity
  parent: PlushieMoth
  id: PlushieMothDeathshead
  name: bartender moth plushie
  description: A fluffy plushie resembling a certain moth bartender. The tiny text reads "Do not give alcohol after midnight".
  components:
  - type: Sprite
    sprite: _Gearstation/Objects/Fun/Plushies/deathshead.rsi
    state: icon
  - type: ReactionMixer
    mixMessage: "spoon-mixing-success"
    timeToMix: 0.5
    reactionTypes:
    - Stir
  - type: Clothing
    sprite: _Gearstation/Objects/Fun/Plushies/deathshead.rsi
  - type: UseDelay
    delay: 1.0
  - type: MeleeWeapon
    attackRate: 1
  - type: Solution
    solution:
      reagents:
      - ReagentId: Fiber
        Quantity: 15
      - ReagentId: Whiskey
        Quantity: 10
      - ReagentId: DrGibb
        Quantity: 5

- type: entity
  parent: PlushieMoth
  id: PlushieMothAstor
  name: battle tested hop moth plushie
  description: A fluffy plushie resembling a pissed off looking moth in a worn HoP uniform.
  components:
  - type: Sprite
    sprite: _Gearstation/Objects/Fun/Plushies/astor.rsi
    state: icon
  - type: Clothing
    sprite: _Gearstation/Objects/Fun/Plushies/astor.rsi
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.06"
  - type: UseDelay
    delay: 1.0
  - type: MeleeWeapon
    attackRate: 1

- type: entity
  parent: PlushieMoth
  id: PlushieMothFirewalker
  name: atmosian moth plushie
  description: A fluffy plushie resembling a certain atmosian. Smells of frezon.
  components:
  - type: Sprite
    sprite: _Gearstation/Objects/Fun/Plushies/firewalker.rsi
  - type: Clothing
    sprite: _Gearstation/Objects/Fun/Plushies/firewalker.rsi
  - type: GasAnalyzer
  - type: ActivatableUI
    inHandsOnly: true
    singleUser: true
    requireActiveHand: false
    key: enum.GasAnalyzerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.GasAnalyzerUiKey.Key:
        type: GasAnalyzerBoundUserInterface
  - type: EmitSoundOnLand
    sound: &PlushieMothSqueakFirewalker
      path: /Audio/Voice/Moth/moth_squeak.ogg
  - type: EmitSoundOnCollide
    sound: &PlushieMothScreamFirewalker
      path: /Audio/Voice/Moth/moth_scream.ogg
  - type: MeleeWeapon
    soundHit: *PlushieMothScreamFirewalker
  - type: Edible
    useSound: *PlushieMothScreamFirewalker