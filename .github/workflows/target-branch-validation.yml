name: Check PR Target Branch

# Cancel older jobs on PRs when new changes are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  check-target-branch:
    runs-on: ubuntu-latest

    steps:
      - name: Check if PR targets Gear-Dev
        run: |
          SOURCE_BRANCH="${{ github.event.pull_request.head.ref }}"
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          echo "PR from: $SOURCE_BRANCH -> $TARGET_BRANCH"

          # Allow starlight-dev to starlight PRs in both directions
          if [[ ("$SOURCE_BRANCH" == "Gear-Dev" && "$TARGET_BRANCH" == "Gear-Main") ||
                ("$SOURCE_BRANCH" == "Gear-Main" && "$TARGET_BRANCH" == "Gear-DEv") ]]; then
            echo "Allowed: PR between starlight-dev and starlight branches"
            exit 0
          fi

          # For all other PRs, require Gear-Dev as target
          if [ "$TARGET_BRANCH" != "Gear-Dev" ]; then
            echo "Error: PR must target 'Gear-Dev' branch, but targets '$TARGET_BRANCH'"
            echo "Please change the target branch to 'Gear-Dev'"
            exit 1
          else
            echo "Success: PR correctly targets 'Gear-Dev' branch"
          fi
